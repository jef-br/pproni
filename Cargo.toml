[package]
name = "pproni"
version = "2.4.0"
edition = "2021"
publish = false

[[bin]]
name = "pproni"
path = "src/main.rs"

[dependencies]
# Default-formats pulls in codecs Pproni never touches — avif alone drags in the whole rav1e/AV1
# encoder stack (v_frame, av-scenechange, ...). Only the formats `batch::SUPPORTED` actually
# accepts as input, plus png for the segmask/test round-trips. Output JPEG goes through
# `jpeg-encoder` below, not through `image`'s own encoder.
image = { version = "0.25", default-features = false, features = [
    "jpeg",
    "png",
    "bmp",
    "tiff",
    "webp",
] }
jpeg-encoder = "0.6"
# SIMD resizer for the working-resolution copy (`preprocessor::downscale_to_working`). Its own `rayon`
# feature stays off: the parallelism lives one level up, one image per worker (`app::batch`).
fast_image_resize = "5"
rayon = "1"
tintbox = "0.4.0"

# ONNX Runtime — real BiRefNet inference, always built in.
#
# `load-dynamic` is not the preference, it is the only thing that works today. Static linking is
# what the single-exe requirement needs, but no static ONNX Runtime with the graphics-card (DirectML)
# support exists: pyke's only prebuilt static one for x86_64-pc-windows-msvc (`ortrs_static` in
# ort-sys' dist.txt) is CPU-only ORT **1.20.0**, and from rc.13 the Windows distribution is
# Microsoft's own build (ms@1.28.0), which is a DLL. (The stock BiRefNet export also needs the native
# `DeformConv` op, which only lands in ORT 1.22; the shipped model has it rewritten away.)
#
# So the exe is still one file, just not by linking: `core::runtime` embeds
# `onnxruntime-directml.dll` (one DLL for graphics card and CPU) with include_bytes! and unpacks it
# to a per-user cache path for `ort::init_from` on first use. `DirectML.dll` is not embedded: it
# comes with Windows 10 1903 and newer. docs/architecture/05-single-exe.md has the detail.
#
# The ort-sys pin is load-bearing for a second reason. Left to resolve it picks rc.13, whose build
# script does not compile against ureq 3's TLS API.
ort = { version = "=2.0.0-rc.9", default-features = false, features = [
    "ndarray",
    "load-dynamic",
] }
ort-sys = "=2.0.0-rc.9"
ndarray = "0.16"

# Windows-only host integration (folders, message boxes, UI language).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_Shell",
    "Win32_Globalization",
    "Win32_System_Com",
    "Win32_System_Console",
] }

# Windows resources (the exe icon). Build-time only; see build.rs.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

# Anti-RE + single-exe hardening. No PDB, no symbols, one codegen unit, abort on panic.
#
# The target is ONE hardened exe, no install. Met: the BiRefNet weights and the ONNX Runtime
# (`onnxruntime-directml.dll`) are embedded in the binary, so nothing sits beside it — see the ort
# dependency above for how the runtime is unpacked, and docs/architecture/05-single-exe.md. Fat LTO
# over an embedded ~188MB model makes release links slow and memory-hungry; that is a build-time
# cost only.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
debug = false
overflow-checks = false

[profile.dev]
opt-level = 1

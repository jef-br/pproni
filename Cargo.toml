[package]
name = "pproni"
version = "2.3.0"
edition = "2021"
publish = false

[[bin]]
name = "pproni"
path = "src/main.rs"

[dependencies]
# Default-formats pulls in codecs Pproni never touches — avif alone drags in the whole rav1e/AV1
# encoder stack (v_frame, av-scenechange, ...). Only the formats `batch::SUPPORTED` actually
# accepts as input, plus png for the segmask/test round-trips. Output JPEG goes through
# `jpeg-encoder` below, not through `image`'s own encoder.
image = { version = "0.25", default-features = false, features = [
    "jpeg",
    "png",
    "bmp",
    "tiff",
    "webp",
] }
jpeg-encoder = "0.6"
# SIMD resizer for the working-resolution copy (`preprocessor::downscale_to_working`). Its own `rayon`
# feature stays off: the parallelism lives one level up, one image per worker (`app::batch`).
fast_image_resize = "5"
rayon = "1"
tintbox = "0.4.0"

# ONNX Runtime — real BiRefNet inference, always built in.
#
# `load-dynamic` is not the preference, it is the only thing that works today. Static linking is
# what the single-exe requirement needs, and pyke does publish a prebuilt static ONNX Runtime for
# x86_64-pc-windows-msvc (`ortrs_static` in ort-sys' dist.txt) — but it is ORT **1.20.0**, and
# BiRefNet's decoder needs the native `DeformConv` op that only lands in ORT 1.22. Linking it
# builds fine and then fails at session load with "Could not find an implementation for
# DeformConv(19)". Later ort releases do not rescue this: from rc.13 the Windows distribution is
# Microsoft's own build (ms@1.28.0), which is a DLL — pyke stopped shipping static Windows libs.
#
# So the exe is still one file, just not by linking: `core::runtime` embeds `onnxruntime.dll` with
# include_bytes! and unpacks it to a temp path for `ort::init_from` on first use. Closing this the
# clean way means building ORT >= 1.22 static from source and pointing `ORT_LIB_LOCATION` at it.
# docs/ARCHITECTURE.md section 5 has the detail.
#
# The ort-sys pin is load-bearing for a second reason. Left to resolve it picks rc.13, whose build
# script does not compile against ureq 3's TLS API.
ort = { version = "=2.0.0-rc.9", default-features = false, features = [
    "ndarray",
    "load-dynamic",
] }
ort-sys = "=2.0.0-rc.9"
ndarray = "0.16"

# Windows-only host integration (folders, message boxes, UI language).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_Shell",
    "Win32_Globalization",
    "Win32_System_Com",
    "Win32_System_Console",
    # PProni-GPU: pre-load the embedded DirectML.dll. (The graphics adapter list uses DXGI, which
    # this windows-sys version has no bindings for - see shot_classifier/gpu_adapters.rs.)
    "Win32_System_LibraryLoader",
] }

# Windows resources (the exe icon). Build-time only; see build.rs.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

# Anti-RE + single-exe hardening. No PDB, no symbols, one codegen unit, abort on panic.
#
# The target is ONE hardened exe, no install. Half met: the BiRefNet weights are embedded in the
# binary by `shot_classifier::birefnet`, so the most copyable thing Pproni owned is no longer a loose
# file. `onnxruntime.dll` is still loaded from beside the exe — see the ort dependency above for
# why, and docs/ARCHITECTURE.md section 5 for what closing it takes. Fat LTO over an embedded
# ~179MB model makes release links slow and memory-hungry; that is a build-time cost only.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
debug = false
overflow-checks = false

[profile.dev]
opt-level = 1
